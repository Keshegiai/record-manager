<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Record Manager</title>
  <link rel="stylesheet" href="css/sidepanel.css">
  <!-- Applies the saved theme before first paint to avoid a flash. -->
  <script src="js/theme-boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-xmark" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
    <symbol id="i-tray" viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  </svg>

  <!-- ============================ Records ============================ -->
  <main id="mainView" class="view">
    <header class="nav">
      <div class="nav-bar">
        <span></span>
        <button id="settingsBtn" class="icon-button" type="button" data-i18n-label="settings">
          <svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg>
        </button>
      </div>
      <h1 class="large-title" data-i18n="appTitle">Records</h1>
      <p id="recordCount" class="subtitle"></p>
    </header>

    <div id="toolbar" class="toolbar">
      <div class="search-row">
        <label class="search-field">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="searchInput" type="text" inputmode="search" autocomplete="off" spellcheck="false"
                 maxlength="200" data-i18n-placeholder="search" data-i18n-label="search">
          <button id="clearSearchBtn" class="clear-button" type="button" data-i18n-label="clearSearch" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-xmark"/></svg>
          </button>
        </label>
        <div class="menu-anchor">
          <button id="sortBtn" class="icon-button tinted" type="button" aria-haspopup="menu" aria-expanded="false"
                  aria-controls="sortMenu" data-i18n-label="sort">
            <svg class="icon" aria-hidden="true"><use href="#i-sort"/></svg>
          </button>
          <div id="sortMenu" class="menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-sort="date-desc"><span data-i18n="sortNewest"></span><svg class="icon check" aria-hidden="true"><use href="#i-check"/></svg></button>
            <button type="button" role="menuitemradio" data-sort="date-asc"><span data-i18n="sortOldest"></span><svg class="icon check" aria-hidden="true"><use href="#i-check"/></svg></button>
            <button type="button" role="menuitemradio" data-sort="alpha-asc"><span data-i18n="sortAZ"></span><svg class="icon check" aria-hidden="true"><use href="#i-check"/></svg></button>
            <button type="button" role="menuitemradio" data-sort="alpha-desc"><span data-i18n="sortZA"></span><svg class="icon check" aria-hidden="true"><use href="#i-check"/></svg></button>
          </div>
        </div>
      </div>
      <div id="filters" class="chips" role="group" data-i18n-label="filters"></div>
    </div>

    <section class="card composer">
      <textarea id="composerInput" rows="3" maxlength="20000" data-i18n-placeholder="composerPlaceholder"
                data-i18n-label="composerLabel"></textarea>
      <div class="composer-bar">
        <label class="picker">
          <span id="composerDot" class="dot"></span>
          <select id="composerCategory" data-i18n-label="category"></select>
          <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </label>
        <span id="charCount" class="counter" aria-hidden="true"></span>
        <button id="saveBtn" class="button-filled" type="button" data-i18n="save" disabled>Save</button>
      </div>
    </section>

    <ul id="recordList" class="card list"></ul>

    <div id="emptyState" class="empty" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-doc"/></svg>
      <h2 id="emptyTitle"></h2>
      <p id="emptyDesc"></p>
    </div>
  </main>

  <!-- ============================ Settings ============================ -->
  <main id="settingsView" class="view" hidden>
    <header class="nav">
      <div class="nav-bar">
        <button id="backBtn" class="back-button" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
          <span data-i18n="back">Back</span>
        </button>
        <span></span>
      </div>
      <h1 class="large-title" data-i18n="settings">Settings</h1>
    </header>

    <section class="group">
      <h2 class="group-title" id="appearanceTitle" data-i18n="appearance"></h2>
      <div id="themeControl" class="segmented" role="radiogroup" aria-labelledby="appearanceTitle">
        <button type="button" role="radio" data-value="system" data-i18n="themeSystem"></button>
        <button type="button" role="radio" data-value="light" data-i18n="themeLight"></button>
        <button type="button" role="radio" data-value="dark" data-i18n="themeDark"></button>
      </div>
      <p class="group-footer" data-i18n="themeFooter"></p>
    </section>

    <section class="group">
      <h2 class="group-title" id="languageTitle" data-i18n="language"></h2>
      <div id="langControl" class="segmented" role="radiogroup" aria-labelledby="languageTitle">
        <button type="button" role="radio" data-value="ru" lang="ru">Русский</button>
        <button type="button" role="radio" data-value="kk" lang="kk">Қазақша</button>
        <button type="button" role="radio" data-value="en" lang="en">English</button>
      </div>
    </section>

    <section class="group">
      <h2 class="group-title" data-i18n="categories"></h2>
      <div class="card">
        <ul id="categoryList" class="cells"></ul>
        <div class="add-category">
          <div class="add-row">
            <input id="newCategoryInput" class="text-field" type="text" maxlength="32" autocomplete="off"
                   data-i18n-placeholder="newCategory" data-i18n-label="newCategory">
            <button id="addCategoryBtn" class="icon-button filled" type="button" data-i18n-label="addCategory" disabled>
              <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
            </button>
          </div>
          <div id="swatches" class="swatches" role="radiogroup" data-i18n-label="color"></div>
        </div>
      </div>
    </section>

    <section class="group">
      <h2 class="group-title" data-i18n="data"></h2>
      <div class="card cells">
        <button id="exportBtn" class="cell cell-button" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg>
          <span data-i18n="export"></span>
        </button>
        <button id="importBtn" class="cell cell-button" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-tray"/></svg>
          <span data-i18n="import"></span>
        </button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
      <p class="group-footer privacy">
        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
        <span data-i18n="privacy"></span>
      </p>
    </section>

    <p id="versionLabel" class="version"></p>
  </main>

  <!-- ============================ Overlays ============================ -->
  <dialog id="editDialog" class="sheet" aria-labelledby="editTitle">
    <div class="sheet-header">
      <button id="editCancel" class="text-button" type="button" data-i18n="cancel"></button>
      <h2 id="editTitle" data-i18n="editTitle"></h2>
      <button id="editDone" class="text-button strong" type="button" data-i18n="done"></button>
    </div>
    <div class="sheet-body">
      <label class="picker">
        <span id="editDot" class="dot"></span>
        <select id="editCategory" data-i18n-label="category"></select>
        <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </label>
      <textarea id="editInput" maxlength="20000" data-i18n-label="editTitle"></textarea>
      <span id="editCount" class="counter" aria-hidden="true"></span>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="alert" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <div class="alert-content">
      <h2 id="confirmTitle"></h2>
      <p id="confirmMessage"></p>
    </div>
    <div class="alert-actions">
      <button id="confirmCancel" type="button" data-i18n="cancel"></button>
      <button id="confirmOk" type="button" class="destructive" data-i18n="delete"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
    <span id="toastText"></span>
  </div>

  <div id="undoBar" class="snackbar" role="status" aria-live="polite" hidden>
    <span id="undoText"></span>
    <button id="undoBtn" type="button" data-i18n="undo"></button>
  </div>
</body>
</html>
